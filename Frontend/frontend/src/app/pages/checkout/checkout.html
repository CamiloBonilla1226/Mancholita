<div class="checkout">
  <div class="checkout-header">
    <p class="checkout-kicker">Envio seguro</p>
    <h1>Finalizar pedido</h1>
    <p class="checkout-subtitle">
      Completa tus datos para coordinar el envio y confirmar tu pedido de forma rapida y clara.
    </p>
  </div>

  <form (ngSubmit)="submitOrder()">
    <div class="checkout-grid">
      <div class="form-group form-group-wide">
        <label>Nombre completo</label>
        <input type="text" placeholder="Tu nombre completo" [(ngModel)]="customerName" name="customerName">
      </div>

      <div class="form-group">
        <label>Telefono</label>
        <input type="text" placeholder="Numero de contacto" [(ngModel)]="phone" name="phone">
      </div>

      <div class="form-group">
        <label>Correo</label>
        <input type="email" placeholder="correo@email.com" [(ngModel)]="email" name="email">
      </div>

      <div class="form-group">
        <label>Identificacion</label>
        <input type="text" placeholder="Cedula o documento" [(ngModel)]="documentNumber" name="documentNumber">
      </div>

      <div class="form-group form-group-wide">
        <label>Direccion</label>
        <input type="text" placeholder="Direccion de entrega" [(ngModel)]="address" name="address">
      </div>

      <div class="form-group">
        <label>Departamento</label>
        <div class="select-wrap">
          <select [(ngModel)]="department" name="department" (ngModelChange)="onDepartmentChange()">
            <option [ngValue]="''" disabled>Selecciona un departamento</option>
            <option *ngFor="let item of departments" [ngValue]="item.name">
              {{ formatCoverageLabel(item.name) }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Ciudad</label>
        <div class="select-wrap">
          <select [(ngModel)]="municipality" name="municipality" [disabled]="!department">
            <option [ngValue]="''" disabled>
              {{ department ? 'Selecciona una ciudad' : 'Primero elige un departamento' }}
            </option>
            <option *ngFor="let municipalityOption of availableMunicipalities" [ngValue]="municipalityOption">
              {{ formatCoverageLabel(municipalityOption) }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <div *ngIf="errorMessage" class="checkout-error">
      {{ errorMessage }}
    </div>

    <button type="submit" class="checkout-button">
      <span class="checkout-button-label">Enviar pedido por WhatsApp</span>
      <span class="checkout-button-note">Confirmacion directa y atencion personalizada</span>
    </button>
  </form>
</div>
